let room3 = []
let room4 = []
let room5 = []

//////////////////////////////////////////////////
// LOAD EVERYTHING ONCE
//////////////////////////////////////////////////

window.onload = function() {

    let savedroom1 = localStorage.getItem("room1")
    if (savedroom1) {
        room1 = savedroom1.split(", ")
        document.getElementById("listguest1").textContent =
            "Guests: " + room1.join(", ")
    }

    let savedroom2 = localStorage.getItem("room2")
    if (savedroom2) {
        room2 = savedroom2.split(", ")
        document.getElementById("listguest2").textContent =
            "Guests: " + room2.join(", ")

    let savedroom3 = localStorage.getItem("room3")

    let savedroom4 = localStorage.getItem("room4")

            "Guests: " + room4.join(", ")

    let savedroom5 = localStorage.getItem("room5")

        room5 = savedroom5.split(", ")
        document.getElementById("listguest5").textContent =
            "Guests: " + room5.join(", ")
    }

    let savedroom6 = localStorage.getItem("room6")
    if (savedroom6) {
        room6 = savedroom6.split(", ")
        document.getElementById("listguest6").textContent =
            "Guests: " + room6.join(", ")
    }

    updateTotalGuests()
}

//////////////////////////////////////////////////
// TOTAL GUEST COUNTER
//////////////////////////////////////////////////

function updateTotalGuests() {

    let allguests = []

    // room 1
    for (let i = 0; i < room1.length; i++) {
        allguests.push(room1[i])
    }

    // room 2
    for (let i = 0; i < room2.length; i++) {
        allguests.push(room2[i])
    }

    // room 3
    for (let i = 0; i < room3.length; i++) {
        allguests.push(room3[i])
    }

    // room 4
    for (let i = 0; i < room4.length; i++) {
        allguests.push(room4[i])
    }

    // room 5
    for (let i = 0; i < room5.length; i++) {
        allguests.push(room5[i])
    }

    // room 6
    for (let i = 0; i < room6.length; i++) {
        allguests.push(room6[i])
    }

    document.getElementById("listofallguests").textContent =
        "Total Guests: " + allguests.join(", ")
}

//////////////////////////////////////////////////
// ROOM ONE
//////////////////////////////////////////////////

let room1locked = false

function addguest1() {

    if (room1.length >= maxguests) {
        alert("Room 1 is full (maximum 4 guests).")
        return
    }

    let addname1 = document.getElementById("enterguest1").value
    if (addname1 === "") return

    room1.push(addname1)

    document.getElementById("listguest1").textContent =
        "Guests: " + room1.join(", ")

    localStorage.setItem("room1", room1.join(", "))

    updateTotalGuests()
}

function removeguest1() {

    let removename1 = document.getElementById("removeguest1").value
    let index = room1.indexOf(removename1)

    if (index !== -1) {
        room1.splice(index, 1)
    }

    document.getElementById("listguest1").textContent =
        "Guests: " + room1.join(", ")

    localStorage.setItem("room1", room1.join(", "))

    updateTotalGuests()
}

function lockroom1() {

    room1locked = !room1locked

    let addbutton = document.querySelector("#enterguest1 + button")

    if (room1locked) {
        addbutton.disabled = true
        alert("Room 1 is now locked.")
    } else {
        addbutton.disabled = false
        alert("Room 1 is now unlocked.")
    }
}

function removeall1() {

    room1 = []

    document.getElementById("listguest1").textContent =
        "Guests: "

    localStorage.removeItem("room1")

    updateTotalGuests()
}
